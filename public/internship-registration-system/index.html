<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://fit-uet.github.io/" />
    <title>Chuyển đến hệ thống Thực tập và Dự án</title>
    <script>
      const destination = new URL('/', location.origin);
      destination.search = location.search;
      destination.hash = location.hash;
      location.replace(destination.href);
    </script>
  </head>
  <body>
    <p>Địa chỉ hệ thống đã chuyển sang <a href="https://fit-uet.github.io/">fit-uet.github.io</a>.</p>
  </body>
</html>
