services:
  - type: web
    name: internship-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_API_KEY
        sync: false
      - key: DB_PROVIDER
        value: d1
      - key: CLOUDFLARE_ACCOUNT_ID
        value: 7f6e0debd543c1ec1871f4f6d2c03dd5
      - key: CLOUDFLARE_DATABASE_ID
        value: bd58a106-1b64-473a-8211-896e84f6072e
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: CORS_ORIGIN
        value: https://fit-uet.github.io
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_DAILY_SEND_CAP
        value: "250"
      - key: EMAIL_BATCH_SIZE
        value: "25"
      - key: EMAIL_SEND_IMMEDIATE
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
